<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">澄客 CRM 账号密码登录流程</title>
  <desc id="desc">从用户提交登录表单开始，经过 Zod 校验、登录接口、内存 Token、授权上下文校验、Redux 更新和授权首页跳转的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#697786" /></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3F6F58" /></marker>
    <marker id="arrow-bad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#B14F4F" /></marker>
    <style>
      .title{font:700 24px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2D3D}.label{font:600 14px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2D3D;text-anchor:middle}.small{font:500 13px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2D3D;text-anchor:middle}.edge{fill:none;stroke:#697786;stroke-width:2;marker-end:url(#arrow)}.ok{fill:none;stroke:#3F6F58;stroke-width:2;marker-end:url(#arrow-ok)}.bad{fill:none;stroke:#B14F4F;stroke-width:2;marker-end:url(#arrow-bad)}.edge-label{font:600 13px Inter,"PingFang SC",sans-serif}.process{fill:#EAF0F5;stroke:#4E6F91;stroke-width:2}.success{fill:#E8F2EC;stroke:#3F6F58;stroke-width:2}.warning{fill:#F8F0DF;stroke:#916A2E;stroke-width:2}.error{fill:#F8E9E9;stroke:#B14F4F;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#F7F9FB" />
  <text x="600" y="48" class="title" text-anchor="middle">澄客 CRM 账号密码登录流程</text>

  <ellipse cx="100" cy="300" rx="70" ry="32" class="success" /><text x="100" y="305" class="label">提交登录表单</text>
  <polygon points="290,246 380,300 290,354 200,300" class="warning" /><text x="290" y="296" class="label"><tspan x="290">Zod 校验</tspan><tspan x="290" dy="20">通过？</tspan></text>
  <rect x="420" y="268" width="160" height="64" rx="8" class="process" /><text x="500" y="296" class="small"><tspan x="500">锁定提交按钮</tspan><tspan x="500" dy="20">清除旧错误</tspan></text>
  <rect x="620" y="268" width="190" height="64" rx="8" class="process" /><text x="715" y="304" class="small">POST /auth/login</text>
  <polygon points="915,246 990,300 915,354 840,300" class="warning" /><text x="915" y="305" class="label">登录成功？</text>
  <rect x="1030" y="268" width="140" height="64" rx="8" class="process" /><text x="1100" y="296" class="small"><tspan x="1100">Access Token</tspan><tspan x="1100" dy="20">写入内存</tspan></text>

  <rect x="195" y="435" width="190" height="70" rx="8" class="error" /><text x="290" y="465" class="small"><tspan x="290">显示字段错误</tspan><tspan x="290" dy="20">保留当前输入</tspan></text>
  <rect x="820" y="435" width="190" height="70" rx="8" class="error" /><text x="915" y="465" class="small"><tspan x="915">显示 ApiError</tspan><tspan x="915" dy="20">恢复提交按钮</tspan></text>
  <rect x="1005" y="405" width="165" height="64" rx="8" class="process" /><text x="1088" y="441" class="small">GET /auth/context</text>
  <polygon points="1088,520 1175,575 1088,630 1000,575" class="warning" /><text x="1088" y="570" class="label"><tspan x="1088">上下文校验</tspan><tspan x="1088" dy="20">通过？</tspan></text>
  <rect x="700" y="655" width="220" height="74" rx="8" class="error" /><text x="810" y="686" class="small"><tspan x="810">显示接口或格式错误</tspan><tspan x="810" dy="20">当前实现需补清 Token</tspan></text>
  <rect x="990" y="655" width="195" height="74" rx="8" class="process" /><text x="1088" y="686" class="small"><tspan x="1088">applyAuthContext</tspan><tspan x="1088" dy="20">更新两个 Redux slice</tspan></text>
  <ellipse cx="1088" cy="795" rx="98" ry="32" class="success" /><text x="1088" y="790" class="small"><tspan x="1088">replace 跳转</tspan><tspan x="1088" dy="18">authorizedHome</tspan></text>

  <path d="M170 300 H198" class="edge" /><path d="M380 300 H418" class="ok" /><text x="396" y="288" class="edge-label" fill="#3F6F58">是</text>
  <path d="M290 354 V433" class="bad" /><text x="302" y="398" class="edge-label" fill="#B14F4F">否</text>
  <path d="M580 300 H618" class="edge" /><path d="M810 300 H838" class="edge" />
  <path d="M990 300 H1028" class="ok" /><text x="1005" y="288" class="edge-label" fill="#3F6F58">是</text>
  <path d="M915 354 V433" class="bad" /><text x="928" y="398" class="edge-label" fill="#B14F4F">否</text>
  <path d="M1100 332 V403" class="edge" /><path d="M1088 469 V518" class="edge" />
  <path d="M1000 575 H810 V653" class="bad" /><text x="948" y="563" class="edge-label" fill="#B14F4F">否</text>
  <path d="M1088 630 V653" class="ok" /><text x="1100" y="646" class="edge-label" fill="#3F6F58">是</text>
  <path d="M1088 729 V761" class="edge" />
</svg>
